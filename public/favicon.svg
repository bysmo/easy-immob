    <path d="M 256 128 L 384 224 L 352 224 L 352 352 C 352 365 341 376 328 376 L 184 376 C 171 376 160 365 160 352 L 160 224 L 128 224 Z" />
    
    <!-- Inner Doorway Cutout -->
    <rect x="224" y="280" width="64" height="96" rx="8" fill="url(#brand-grad)" />
    
    <!-- Window Grid Accent -->
    <rect x="200" y="208" width="40" height="40" rx="6" fill="url(#brand-grad)" opacity="0.9" />
    <rect x="272" y="208" width="40" height="40" rx="6" fill="url(#brand-grad)" opacity="0.9" />
